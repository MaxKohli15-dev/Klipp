<style>
:root{
  --bg:#1a1124; --panel:#251934; --panel2:#30213f; --line:#41305a;
  --text:#f5eefc; --muted:#a898c4; --accent:#ff3d77; --lilac:#b79cff;
  --nav:68px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 15px/1.45 'DM Sans',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:232px 1fr;height:100dvh}
nav.rail{padding:22px 14px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:var(--bg)}
.logo{font:800 32px 'Bricolage Grotesque',sans-serif;letter-spacing:-.05em;padding:0 12px 20px}
.logo i{color:var(--accent);font-style:normal}
nav.rail a{display:flex;align-items:center;gap:14px;padding:12px;position:relative;border-radius:14px;color:var(--muted);font-weight:500}
nav.rail a:hover,nav.rail a.on{color:var(--text);background:var(--panel)}
nav.rail a.cta{background:var(--accent);color:#fff;margin:6px 0}
nav.rail a.cta:hover{background:#ff5c8d}
main#view{position:relative;overflow:hidden;height:100dvh}
.page{height:100%;overflow-y:auto;padding:32px 28px 48px}
.narrow{max-width:520px;margin:0 auto}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
h1{font-size:34px;line-height:1.1;font-weight:800}
.muted{color:var(--muted)}

/* ---------- Buttons / Felder ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700}
.btn:hover{background:#ff5c8d}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--panel2);color:var(--text)}
.btn.ghost:hover{background:var(--line)}
.btn.small{padding:6px 14px;font-size:13px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.field label{font-weight:500;color:var(--muted);font-size:13px}
.field input,.field textarea{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
.field input:focus,.field textarea:focus{outline:2px solid var(--lilac);border-color:transparent}
.field textarea{resize:vertical;min-height:90px}
.err{color:#ff8fa8;margin-top:14px;min-height:20px;font-size:14px}
.ok{color:#9be8b4}
.seg{display:flex;background:var(--panel);border-radius:999px;padding:4px;margin:22px 0 4px}
.seg button{flex:1;padding:9px;border-radius:999px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text)}

/* ---------- Avatar ---------- */
.av{--s:36px;width:var(--s);height:var(--s);border-radius:50%;background:var(--lilac);color:#2a1745;display:inline-grid;place-items:center;font:800 calc(var(--s)*.42) 'Bricolage Grotesque',sans-serif;overflow:hidden;flex:none;object-fit:cover}

/* ---------- Feed ---------- */
.feedwrap{position:relative;height:100%}
.feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.clip{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;justify-content:center;align-items:center;padding:12px 0}
.frame{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;background:#000;border-radius:24px;overflow:hidden}
.frame video{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.frame video.wide{object-fit:contain}
.frame::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,rgba(10,4,16,.78));pointer-events:none}
.frame::before{content:"";position:absolute;inset:0 0 auto 0;height:90px;background:linear-gradient(rgba(10,4,16,.55),transparent);pointer-events:none;z-index:1}
.playflag{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .15s;z-index:2}
.playflag span{width:76px;height:76px;border-radius:50%;background:rgba(20,8,30,.55);display:grid;place-items:center}
.playflag svg{width:34px;height:34px;fill:#fff;stroke:none}
.frame.paused .playflag{opacity:1}
.meta{position:absolute;left:16px;right:84px;bottom:18px;z-index:3;pointer-events:none}
.meta>*{pointer-events:auto}
.who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.who .un{font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.follow{padding:4px 12px;border-radius:999px;border:1.5px solid #fff;font-weight:700;font-size:13px}
.follow.on{border-color:transparent;background:rgba(255,255,255,.2)}
.cap{text-shadow:0 1px 6px rgba(0,0,0,.6);overflow-wrap:anywhere;max-height:4.4em;overflow:hidden}
.rail-actions{position:absolute;right:10px;bottom:18px;display:flex;flex-direction:column;gap:16px;align-items:center;z-index:3}
.rail-actions button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.rail-actions .ring{width:46px;height:46px;border-radius:50%;background:rgba(30,14,44,.55);display:grid;place-items:center;transition:transform .12s}
.rail-actions button:active .ring{transform:scale(.88)}
.rail-actions .on .ring{color:var(--accent)}
.rail-actions .on svg{fill:var(--accent)}
.tabs{position:absolute;top:16px;left:0;right:0;display:flex;justify-content:center;gap:22px;z-index:6;pointer-events:none}
.tabs button{pointer-events:auto;font:800 17px 'Bricolage Grotesque',sans-serif;color:rgba(255,255,255,.6);text-shadow:0 1px 8px rgba(0,0,0,.6);padding:4px 2px;border-bottom:2px solid transparent}
.tabs button.on{color:#fff;border-color:#fff}
.mutebtn{position:absolute;top:12px;right:14px;z-index:6;width:42px;height:42px;border-radius:50%;background:rgba(30,14,44,.6);display:grid;place-items:center}
.empty{height:100%;display:grid;place-items:center;text-align:center;padding:24px}
.empty div{max-width:340px}
.empty h2{font-size:26px;margin-bottom:8px}
.empty .btn{margin-top:18px}

/* ---------- Profil ---------- */
.pwide{max-width:1000px;margin:0 auto}
.ph2{display:flex;gap:32px;align-items:flex-start;margin-bottom:30px}
.ph2 .av{--s:150px}
.pinfo2{flex:1;min-width:0;padding-top:6px}
.pname{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pname h1{font-size:26px;line-height:1.15;overflow-wrap:anywhere}
.pname .sep{width:1px;height:20px;background:var(--line)}
.pname .uname{color:var(--muted);font-size:17px;font-weight:500}
.pstats{display:flex;gap:20px;margin:12px 0 16px;flex-wrap:wrap}
.pstats b{font-weight:800;margin-right:4px}
.pbtns{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ic-btn{width:42px;height:42px;border-radius:50%;background:var(--panel2);display:grid;place-items:center}
.ic-btn:hover{background:var(--line)}
.bio{margin-top:16px;color:#e3d7f3;overflow-wrap:anywhere;white-space:pre-wrap;max-width:560px}
.ptabs{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);margin-bottom:18px;gap:12px;flex-wrap:wrap}
.tabs2{display:flex;gap:6px}
.tabs2 button{display:flex;align-items:center;gap:8px;padding:12px 22px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs2 button:hover{color:var(--text)}
.tabs2 button.on{color:var(--text);border-color:var(--text)}
.tabs2 svg.i{width:18px;height:18px}
.chips{display:flex;background:var(--panel);border-radius:10px;padding:3px;margin-bottom:6px}
.chips button{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted)}
.chips button.on{background:var(--panel2);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:9/14;background:var(--panel);border-radius:12px;overflow:hidden}
.thumb video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.thumb span{position:absolute;left:8px;bottom:6px;font-weight:700;font-size:13px;text-shadow:0 1px 4px rgba(0,0,0,.8);display:flex;align-items:center;gap:4px}
.thumb span svg{width:14px;height:14px;fill:#fff;stroke:#fff;stroke-width:1}
.msg{text-align:center;padding:48px 0;color:var(--muted)}
.msg .btn{margin-top:16px}
.mlist{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.mlist .btn{width:100%}

/* ---------- Suche / Listen / Chat ---------- */
.narrow2{max-width:640px}
.sinput,.sbar input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:13px 20px;margin-top:16px}
.sinput:focus,.sbar input:focus{outline:2px solid var(--lilac);border-color:transparent}
.sbar{display:flex;gap:10px;align-items:center;margin:16px 0}
.sbar input{margin-top:0}
.smode{display:inline-flex}
.row{display:flex;align-items:center;gap:14px;padding:12px;border-radius:16px;width:100%;text-align:left}
.row:hover{background:var(--panel)}
.row.unread{background:var(--panel)}
.row .t{flex:1;min-width:0}
.row .t b{font-weight:700}
.row .t p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.row .when{color:var(--muted);font-size:12px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.tagchips{display:flex;flex-wrap:wrap;gap:8px}
.tagchips a{padding:7px 14px;border-radius:999px;background:var(--panel2);font-weight:700;font-size:14px}
.tagchips a:hover{background:var(--line)}
.tagchips small{color:var(--muted);margin-left:4px}
a.tag{font-weight:700;color:#fff}
a.tag:hover{text-decoration:underline}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font:700 11px/18px 'DM Sans',sans-serif;text-align:center;font-style:normal;margin-left:auto}
.badge[hidden]{display:none}
.chat{display:flex;flex-direction:column;height:100%}
.chath{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.chath b{font-weight:700}
.bubbles{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:16px 18px}
.bub{max-width:75%;padding:9px 14px;border-radius:18px 18px 18px 6px;background:var(--panel2);overflow-wrap:anywhere;white-space:pre-wrap;align-self:flex-start}
.bub.me{align-self:flex-end;background:var(--accent);color:#fff;border-radius:18px 18px 6px 18px}
.bub small{display:block;font-size:11px;opacity:.65;margin-top:2px}
.chat form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.chat form input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:11px 18px}

/* ---------- Upload ---------- */
.drop{display:grid;place-items:center;gap:8px;text-align:center;padding:30px 18px;margin-top:24px;border:2px dashed var(--line);border-radius:20px;cursor:pointer;color:var(--muted)}
.drop:hover{border-color:var(--lilac);color:var(--text)}
.drop input{display:none}
.preview{margin-top:20px;max-height:380px;width:100%;border-radius:18px;background:#000}

/* ---------- Kommentare / Modal ---------- */
#sheet{position:fixed;z-index:50;background:var(--panel);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s ease;right:0;top:0;bottom:0;width:400px;border-left:1px solid var(--line)}
#sheet.open{transform:none}
#sheet header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
#clist{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:16px}
.c{display:flex;gap:10px}
.c .av{--s:32px}
.c .t{flex:1;min-width:0}
.c .t b{font-weight:700}
.c .t small{color:var(--muted);margin-left:6px}
.c .t p{overflow-wrap:anywhere}
.c .x{color:var(--muted);align-self:flex-start}
#cform{display:flex;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
#cform input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:10px 16px;min-width:0}
#modal{position:fixed;inset:0;z-index:70;background:rgba(10,4,16,.7);display:none;place-items:center;padding:20px}
#modal.open{display:grid}
#modal .card{background:var(--panel);border-radius:22px;padding:26px;width:100%;max-width:440px;border:1px solid var(--line)}
#viewer{position:fixed;inset:0;z-index:40;background:var(--bg);display:none}
#viewer.open{display:block}
#viewer .close{position:absolute;top:12px;left:14px;z-index:8;width:42px;height:42px;border-radius:50%;background:rgba(30,14,44,.6);display:grid;place-items:center}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--text);color:#2a1745;padding:11px 20px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.oauth{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 20px;border-radius:999px;font-weight:700;color:#fff;margin-bottom:10px}
.oauth.discord{background:#5865f2}.oauth.discord:hover{background:#6d78f5}
.oauth.google{background:#fff;color:#2a1745}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:18px 0 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* =========================================================
   Konfiguration (der publishable Key ist für den Browser gedacht –

const SUPABASE_URL = 'https://oxmgdhbuqweqdgfjuiyt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_In9D3KU5eWDnJGXStApKYw_RYyca7xg';
const MAX_VIDEO_MB = 50;
// Welche Login-Anbieter angezeigt werden. Nur eintragen, was du in Supabase
// unter Authentication → Sign In / Providers aktiviert hast: 'discord', 'google'
const OAUTH = ['discord'];
const OAUTH_LABEL = { discord: 'Mit Discord fortfahren', google: 'Mit Google fortfahren' };

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------- Helfer ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1).replace('.0','') + ' Mio.' : n >= 1e4 ? (n/1e3).toFixed(1).replace('.0','') + ' Tsd.' : String(n);
function ago(d){const s=(Date.now()-new Date(d))/1000;if(s<60)return 'gerade eben';if(s<3600)return `vor ${Math.floor(s/60)} Min.`;if(s<86400)return `vor ${Math.floor(s/3600)} Std.`;return `vor ${Math.floor(s/86400)} Tg.`}
const IC = {
  heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',
  comment:'<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.2A8.4 8.4 0 1 1 21 11.5z"/>',
  share:'<path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>',

  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  vol:'<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>',
  mute:'<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/>',

  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  bookmark:'<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
  back:'<path d="M15 18l-6-6 6-6"/>',
  film:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M10 9l5 3-5 3z"/>'
};
const svg = n => `<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
function avatar(p, s = 36){
  const st = `style="--s:${s}px"`;
  if (p?.avatar_url) return `<img class="av" ${st} src="${esc(p.avatar_url)}" alt="">`;
  return `<span class="av" ${st}>${esc((p?.username || '?')[0].toUpperCase())}</span>`;
}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}
function needAuth(){toast('Melde dich an, um mitzumachen.');location.hash='#/auth'}

/* ---------- State ---------- */
let me = null, myProfile = null;
let likedSet = new Set(), followingSet = new Set(), savedSet = new Set();
let msgTimer = null, sTimer = null, sMode = 'users', unread = { n: 0, m: 0 };
let muted = true, feedTab = 'foryou', authMode = 'login';
const vmap = new Map();
let activeIO = null, viewerIO = null, sheetVideo = null;
const view = $('#view');

async function loadMe(){
  likedSet = new Set(); followingSet = new Set(); savedSet = new Set(); myProfile = null;
  if (!me) return;
  const [p, f, b] = await Promise.all([
    sb.from('klipp_profiles').select('*').eq('id', me.id).maybeSingle(),
    sb.from('klipp_follows').select('following_id').eq('follower_id', me.id),
    sb.from('klipp_bookmarks').select('video_id').eq('user_id', me.id).limit(1000)
  ]);
  myProfile = p.data;
  followingSet = new Set((f.data || []).map(x => x.following_id));
  savedSet = new Set((b.data || []).map(x => x.video_id));
}

/* ---------- Navigation ---------- */
function renderNav(){
  const h = location.hash || '#/';
  const on = k => ({
    home: h === '#/' || h === '', srch: h.startsWith('#/search') || h.startsWith('#/tag/'), up: h === '#/upload',
    msg: h.startsWith('#/messages'), inb: h === '#/inbox',
    me: h === '#/me' || (myProfile && h === '#/u/' + myProfile.username), auth: h === '#/auth'
  })[k] ? 'on' : '';
  $('#nav').innerHTML = `
    <div class="logo">klipp<i>.</i></div>
    <a href="#/" class="${on('home')}" aria-label="Start">${svg('home')}<span class="lbl">Start</span></a>
    <a href="#/search" class="${on('srch')}" aria-label="Suche">${svg('search')}<span class="lbl">Suche</span></a>
    <a href="#/upload" class="cta ${on('up')}" aria-label="Hochladen">${svg('plus')}<span class="lbl">Hochladen</span></a>
    ${me ? `<a href="#/messages" class="${on('msg')}" aria-label="Nachrichten">${svg('mail')}<span class="lbl">Nachrichten</span><i class="badge" id="b-m" hidden>0</i></a>
            <a href="#/inbox" class="${on('inb')}" aria-label="Mitteilungen">${svg('bell')}<span class="lbl">Mitteilungen</span><i class="badge" id="b-n" hidden>0</i></a>
            <a href="#/me" class="${on('me')}" aria-label="Profil">${svg('user')}<span class="lbl">Profil</span></a>`
         : `<a href="#/auth" class="${on('auth')}" aria-label="Anmelden">${svg('user')}<span class="lbl">Anmelden</span></a>`}`;
  paintBadges();
}
function paintBadges(){
  [['n', '#b-n'], ['m', '#b-m']].forEach(([k, sel]) => {
    const b = $(sel); if (!b) return;
    b.textContent = unread[k] > 99 ? '99+' : unread[k]; b.hidden = !unread[k];
  });
}
async function refreshBadges(){
  if (!me){ unread = { n: 0, m: 0 }; paintBadges(); return; }
  const [n, m] = await Promise.all([
    sb.from('klipp_notifications').select('*', { count: 'exact', head: true }).eq('user_id', me.id).eq('read', false),
    sb.from('klipp_messages').select('*', { count: 'exact', head: true }).eq('recipient_id', me.id).is('read_at', null)
  ]);
  unread = { n: n.count || 0, m: m.count || 0 };
  paintBadges();
}

function cleanup(){
  if (activeIO){activeIO.disconnect();activeIO=null}
  clearInterval(msgTimer); closeSheet(); closeViewer();
  $$('#view video').forEach(v => v.pause());
}

async function route(){
  cleanup();
  const h = location.hash || '#/';
  renderNav();
  if (h.startsWith('#/u/')) return viewProfile(decodeURIComponent(h.slice(4)));
  if (h === '#/upload') return viewUpload();
  if (h.startsWith('#/search')) return viewSearch();
  if (h.startsWith('#/tag/')) return viewTag(decodeURIComponent(h.slice(6)));
  if (h === '#/inbox') return viewInbox();
  if (h === '#/messages') return viewMessages();
  if (h.startsWith('#/messages/')) return viewThread(decodeURIComponent(h.slice(11)));
  if (h === '#/auth') return viewAuth();
  if (h === '#/me') { if (!me) return needAuth(); if (!myProfile) { view.innerHTML='<div class="spin"></div>'; await loadMe(); } if (!myProfile) { view.innerHTML = `<div class="empty"><div><h2>Dein Profil fehlt noch</h2><p class="muted">Du bist angemeldet, aber für dein Konto wurde kein Profil angelegt. Führe <b>fix-profile.sql</b> im Supabase SQL Editor aus und lade die Seite neu.</p><button class="btn" data-act="logout">Abmelden</button></div></div>`; return; } return location.replace('#/u/' + myProfile.username); }
  return viewFeed();
}
window.addEventListener('hashchange', route);

/* =========================================================
   Videos laden & Clips rendern
   ========================================================= */
const SEL = 'id,user_id,video_url,storage_path,caption,created_at,profiles:klipp_profiles!klipp_videos_user_id_fkey(username,avatar_url),likes:klipp_likes(count),comments:klipp_comments(count)';

async function enrich(rows){
  rows = rows || [];
  if (me && rows.length){
    const { data } = await sb.from('klipp_likes').select('video_id').eq('user_id', me.id).in('video_id', rows.map(r => r.id));
    (data || []).forEach(x => likedSet.add(x.video_id));
  }
  return rows.map(r => {
    const v = { ...r, likeCount: r.likes?.[0]?.count ?? 0, commentCount: r.comments?.[0]?.count ?? 0 };
    vmap.set(v.id, v);
    return v;
  });
}

function followBtn(uid){
  if (me && me.id === uid) return '';
  return `<button class="follow ${followingSet.has(uid) ? 'on' : ''}" data-act="follow" data-uid="${uid}">${followingSet.has(uid) ? 'Gefolgt' : 'Folgen'}</button>`;
}

function capHTML(t){
  return String(t || '').split(/(#[\p{L}\p{N}_]{1,40})/u).map(p =>
    /^#[\p{L}\p{N}_]+$/u.test(p) ? `<a class="tag" href="#/tag/${encodeURIComponent(p.slice(1).toLowerCase())}">${esc(p)}</a>` : esc(p)
  ).join('');
}
function clipHTML(v){
  const p = v.profiles || {};
  const own = me && me.id === v.user_id;
  return `<article class="clip" data-id="${v.id}">
    <div class="frame">
      <video src="${esc(v.video_url)}" loop playsinline preload="metadata" data-act="toggle"></video>
      <div class="playflag"><span><svg viewBox="0 0 24 24">${IC.play}</svg></span></div>
      <div class="meta">
        <div class="who">
          <a href="#/u/${esc(p.username)}">${avatar(p, 38)}</a>
          <a class="un" href="#/u/${esc(p.username)}">@${esc(p.username)}</a>
          ${followBtn(v.user_id)}
        </div>
        ${v.caption ? `<p class="cap">${capHTML(v.caption)}</p>` : ''}
      </div>
      <div class="rail-actions">
        <button data-act="like" class="${likedSet.has(v.id) ? 'on' : ''}" aria-label="Gefällt mir"><span class="ring">${svg('heart')}</span><span class="n">${fmt(v.likeCount)}</span></button>
        <button data-act="comment" aria-label="Kommentare"><span class="ring">${svg('comment')}</span><span class="cn">${fmt(v.commentCount)}</span></button>
        <button data-act="save" class="${savedSet.has(v.id) ? 'on' : ''}" aria-label="Zu Favoriten"><span class="ring">${svg('bookmark')}</span><span>Merken</span></button>
        <button data-act="share" aria-label="Teilen"><span class="ring">${svg('share')}</span><span>Teilen</span></button>
        ${own ? `<button data-act="delete" aria-label="Löschen"><span class="ring">${svg('trash')}</span><span>Löschen</span></button>` : ''}
      </div>
    </div>
  </article>`;
}

function attachAutoplay(container){
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      const vid = $('video', e.target), frame = $('.frame', e.target);
      if (e.isIntersecting && e.intersectionRatio >= .6){
        vid.muted = muted;
        vid.play().then(() => frame.classList.remove('paused')).catch(() => {});
      } else {
        vid.pause(); frame.classList.remove('paused');
        if (!e.isIntersecting) vid.currentTime = 0;
      }
    });
  }, { threshold: [0, .6, 1] });
  $$('.clip', container).forEach(c => {
    io.observe(c);
    const vid = $('video', c);
    vid.addEventListener('loadedmetadata', () => { if (vid.videoWidth > vid.videoHeight * 1.1) vid.classList.add('wide'); });
  });
  return io;
}

/* =========================================================
   Feed
   ========================================================= */
async function viewFeed(){
  view.innerHTML = `<div class="feedwrap">
    <div class="tabs">
      <button data-tab="following" class="${feedTab === 'following' ? 'on' : ''}">Folge ich</button>
      <button data-tab="foryou" class="${feedTab === 'foryou' ? 'on' : ''}">Für dich</button>
    </div>
    <button class="mutebtn" data-act="mute" aria-label="Ton an/aus">${svg(muted ? 'mute' : 'vol')}</button>
    <div class="feed" id="feed"><div class="spin"></div></div>
  </div>`;
  const feed = $('#feed');
  let rows = [];

  if (feedTab === 'following'){
    if (!me){
      feed.innerHTML = `<div class="empty"><div><h2>Folge deinen Lieblings-Creatorn</h2><p class="muted">Melde dich an, dann siehst du hier ihre neuesten Clips.</p><a class="btn" href="#/auth">Anmelden</a></div></div>`;
      return;
    }
    const ids = [...followingSet];
    if (!ids.length){
      feed.innerHTML = `<div class="empty"><div><h2>Noch niemandem gefolgt</h2><p class="muted">Folge Creatorn im Tab „Für dich“, dann erscheinen ihre Videos hier.</p></div></div>`;
      return;
    }
    const { data, error } = await sb.from('klipp_videos').select(SEL).in('user_id', ids).order('created_at', { ascending: false }).limit(40);
    if (error) return feedError(feed, error);
    rows = data;
  } else {
    const { data, error } = await sb.from('klipp_videos').select(SEL).order('created_at', { ascending: false }).limit(40);
    if (error) return feedError(feed, error);
    rows = data;
    // Geteilter Link: ?v=<id> zeigt dieses Video zuerst
    const shared = new URLSearchParams(location.search).get('v');
    if (shared){
      const { data: one } = await sb.from('klipp_videos').select(SEL).eq('id', shared).maybeSingle();
      if (one) rows = [one, ...rows.filter(r => r.id !== one.id)];
    }
  }

  const vids = await enrich(rows);
  if (!vids.length){
    feed.innerHTML = `<div class="empty"><div><h2>Noch nichts los hier</h2><p class="muted">Lade das erste Video hoch und starte die Plattform.</p><a class="btn" href="#/upload">Video hochladen</a></div></div>`;
    return;
  }
  feed.innerHTML = vids.map(clipHTML).join('');
  activeIO = attachAutoplay(feed);
}
function feedError(el, error){
  el.innerHTML = `<div class="empty"><div><h2>Das hat nicht geklappt</h2><p class="muted">${esc(error.message)}</p></div></div>`;
}

/* =========================================================
   Aktionen (like, follow, share, comment, delete …)
   ========================================================= */
function paintLike(v){
  $$(`.clip[data-id="${v.id}"] [data-act="like"]`).forEach(b => {
    b.classList.toggle('on', likedSet.has(v.id));
    $('.n', b).textContent = fmt(v.likeCount);
  });
}
async function toggleLike(v){
  if (!me) return needAuth();
  const on = !likedSet.has(v.id);
  on ? likedSet.add(v.id) : likedSet.delete(v.id);
  v.likeCount += on ? 1 : -1; paintLike(v);
  const { error } = on
    ? await sb.from('klipp_likes').insert({ user_id: me.id, video_id: v.id })
    : await sb.from('klipp_likes').delete().match({ user_id: me.id, video_id: v.id });
  if (error){
    on ? likedSet.delete(v.id) : likedSet.add(v.id);
    v.likeCount += on ? -1 : 1; paintLike(v); toast('Like konnte nicht gespeichert werden.');
  }
}
function paintSave(v){ $$(`.clip[data-id="${v.id}"] [data-act="save"]`).forEach(b => b.classList.toggle('on', savedSet.has(v.id))); }
async function toggleSave(v){
  if (!me) return needAuth();
  const on = !savedSet.has(v.id);
  on ? savedSet.add(v.id) : savedSet.delete(v.id); paintSave(v);
  const { error } = on
    ? await sb.from('klipp_bookmarks').insert({ user_id: me.id, video_id: v.id })
    : await sb.from('klipp_bookmarks').delete().match({ user_id: me.id, video_id: v.id });
  if (error){ on ? savedSet.delete(v.id) : savedSet.add(v.id); paintSave(v); return toast('Speichern nicht möglich. Hast du features.sql ausgeführt?'); }
  pState.saved = null;
  toast(on ? 'Zu Favoriten hinzugefügt' : 'Aus Favoriten entfernt');
}
async function toggleFollow(uid){
  if (!me) return needAuth();
  if (uid === me.id) return;
  const on = !followingSet.has(uid);
  const paint = () => {
    $$(`[data-act="follow"][data-uid="${uid}"]`).forEach(b => {
      b.classList.toggle('on', followingSet.has(uid));
      b.textContent = followingSet.has(uid) ? (b.classList.contains('follow') ? 'Gefolgt' : 'Gefolgt') : 'Folgen';
    });
    const fc = $('#fcount'); if (fc && fc.dataset.uid === uid) fc.textContent = fmt(+fc.dataset.n);
  };
  const fc = $('#fcount');
  on ? followingSet.add(uid) : followingSet.delete(uid);
  if (fc && fc.dataset.uid === uid) fc.dataset.n = +fc.dataset.n + (on ? 1 : -1);
  paint();
  const { error } = on
    ? await sb.from('klipp_follows').insert({ follower_id: me.id, following_id: uid })
    : await sb.from('klipp_follows').delete().match({ follower_id: me.id, following_id: uid });
  if (error){
    on ? followingSet.delete(uid) : followingSet.add(uid);
    if (fc && fc.dataset.uid === uid) fc.dataset.n = +fc.dataset.n + (on ? -1 : 1);
    paint(); toast('Das hat nicht geklappt.');
  }
}
async function shareVideo(v){
  const url = location.href.split('#')[0].split('?')[0] + '?v=' + v.id;
  try {
    if (navigator.share) await navigator.share({ title: 'Klipp', text: v.caption || 'Schau dir das an', url });
    else { await navigator.clipboard.writeText(url); toast('Link kopiert'); }
  } catch (e) { if (e.name !== 'AbortError') toast('Link: ' + url); }
}
async function deleteVideo(v){
  if (!confirm('Dieses Video endgültig löschen?')) return;
  const { error } = await sb.from('klipp_videos').delete().eq('id', v.id);
  if (error) return toast('Löschen fehlgeschlagen.');
  await sb.storage.from('klipp-videos').remove([v.storage_path]);
  $$(`.clip[data-id="${v.id}"]`).forEach(c => c.remove());
  vmap.delete(v.id); toast('Video gelöscht');
  if ($('#viewer.open')) { closeViewer(); route(); }
}

/* ---------- globaler Klick-Handler ---------- */
document.addEventListener('click', async e => {
  const tab = e.target.closest('[data-tab]');
  if (tab){ feedTab = tab.dataset.tab; return viewFeed(); }
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const clip = btn.closest('.clip');
  const v = clip && vmap.get(clip.dataset.id);

  if (act === 'toggle'){
    const vid = btn, frame = clip.querySelector('.frame');
    if (vid.paused){ vid.muted = muted; vid.play(); frame.classList.remove('paused'); }
    else { vid.pause(); frame.classList.add('paused'); }
  }
  else if (act === 'like' && v) toggleLike(v);
  else if (act === 'save' && v) toggleSave(v);
  else if (act === 'open-video'){
    const { data } = await sb.from('klipp_videos').select(SEL).eq('id', btn.dataset.vid).maybeSingle();
    if (!data) return toast('Dieses Video gibt es nicht mehr.');
    const [vv] = await enrich([data]); openViewer([vv], 0);
  }
  else if (act === 'comment' && v) openComments(v);
  else if (act === 'share' && v) shareVideo(v);
  else if (act === 'delete' && v) deleteVideo(v);
  else if (act === 'follow') toggleFollow(btn.dataset.uid);
  else if (act === 'close-sheet') closeSheet();
  else if (act === 'mute'){
    muted = !muted;
    btn.innerHTML = svg(muted ? 'mute' : 'vol');
    $$('video').forEach(x => x.muted = muted);
  }
  else if (act === 'del-comment'){
    const { error } = await sb.from('klipp_comments').delete().eq('id', btn.dataset.id);
    if (error) return toast('Löschen fehlgeschlagen.');
    btn.closest('.c').remove();
    if (sheetVideo) bumpComments(sheetVideo, -1);
  }
  else if (act === 'close-viewer'){ closeViewer(); }
  else if (act === 'logout'){ $('#modal').classList.remove('open'); await sb.auth.signOut(); toast('Abgemeldet'); }
  else if (act === 'settings') openSettings();
  else if (act === 'ptab'){ pState.tab = btn.dataset.t; renderProfileGrid(); }
  else if (act === 'psort'){ pState.sort = btn.dataset.s; renderProfileGrid(); }
  else if (act === 'share-profile'){
    const url = location.href.split('#')[0].split('?')[0] + '#/u/' + btn.dataset.user;
    try {
      if (navigator.share) await navigator.share({ title: 'Klipp', url });
      else { await navigator.clipboard.writeText(url); toast('Profil-Link kopiert'); }
    } catch (e) { if (e.name !== 'AbortError') toast(url); }
  }
  else if (act === 'edit-profile') openEditProfile();
  else if (act === 'close-modal') $('#modal').classList.remove('open');
});
document.addEventListener('dblclick', e => {
  const vid = e.target.closest('video[data-act="toggle"]');
  if (!vid) return;
  const v = vmap.get(vid.closest('.clip').dataset.id);
  if (v && !likedSet.has(v.id)) toggleLike(v);
});

async function loadVideosFrom(table, uid){
  const { data: l } = await sb.from(table).select('video_id').eq('user_id', uid).order('created_at', { ascending: false }).limit(60);
  const ids = (l || []).map(x => x.video_id);
  if (!ids.length) return [];
  const { data } = await sb.from('klipp_videos').select(SEL).in('id', ids);
  const vids = await enrich(data);
  const order = new Map(ids.map((id, i) => [id, i]));
  return vids.sort((a, b) => order.get(a.id) - order.get(b.id));
}
const loadLikedVideos = uid => loadVideosFrom('klipp_likes', uid);

async function renderProfileGrid(){
  const st = pState;
  $$('.tabs2 button').forEach(b => b.classList.toggle('on', b.dataset.t === st.tab));
  const chips = $('#chips'); if (!chips) return;
  chips.style.display = st.tab === 'videos' ? '' : 'none';
  $$('#chips button').forEach(b => b.classList.toggle('on', b.dataset.s === st.sort));
  let list;
  if (st.tab === 'liked'){
    if (!st.liked){
      $('#pgrid').innerHTML = '<div class="spin"></div>';
      st.liked = await loadLikedVideos(st.p.id);
    }
    list = st.liked;
  } else if (st.tab === 'saved'){
    if (!st.saved){
      $('#pgrid').innerHTML = '<div class="spin"></div>';
      st.saved = await loadVideosFrom('klipp_bookmarks', st.p.id);
    }
    list = st.saved;
  } else {
    list = [...st.vids];
    if (st.sort === 'top') list.sort((a, b) => b.likeCount - a.likeCount);
    else if (st.sort === 'old') list.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  }
  const g = $('#pgrid'); if (!g || st !== pState) return;   // Seite wurde inzwischen gewechselt
  st.list = list;
  if (!list.length){
    g.innerHTML = st.tab === 'liked' ? '<div class="msg">Du hast noch keine Videos geliked.</div>'
      : st.tab === 'saved' ? '<div class="msg">Noch keine Favoriten. Tippe bei einem Video auf „Merken“.</div>'
      : `<div class="msg">${st.own ? 'Du hast noch nichts hochgeladen.' : 'Noch keine Videos.'}${st.own ? '<br><a class="btn" href="#/upload">Erstes Video hochladen</a>' : ''}</div>`;
    return;
  }
  g.innerHTML = `<div class="grid">${list.map((v, i) => `
    <button class="thumb" data-i="${i}" aria-label="Video ansehen">
      <video src="${esc(v.video_url)}#t=0.3" preload="metadata" muted playsinline></video>
      <span><svg class="i" viewBox="0 0 24 24">${IC.heart}</svg>${fmt(v.likeCount)}</span>
    </button>`).join('')}</div>`;
  $$('.thumb', g).forEach(t => t.addEventListener('click', () => openViewer(st.list, +t.dataset.i)));
}

function viewUpload(){
  if (!me){ view.innerHTML = `<div class="empty"><div><h2>Zum Hochladen anmelden</h2><p class="muted">Du brauchst ein Konto, um Videos zu veröffentlichen.</p><a class="btn" href="#/auth">Anmelden</a></div></div>`; return; }
  view.innerHTML = `<div class="page"><div class="narrow">
    <h1>Video hochladen</h1>
    <p class="muted" style="margin-top:8px">MP4, WebM oder MOV, bis ${MAX_VIDEO_MB} MB. Hochkant (9:16) sieht am besten aus.</p>
    <form id="uform">
      <label class="drop" id="drop">${svg('film')}<b id="dname">Video auswählen</b><span>Tippen oder Datei hierher ziehen</span>
        <input type="file" id="ufile" accept="video/mp4,video/webm,video/quicktime"></label>
      <video id="uprev" class="preview" controls playsinline hidden></video>
      <div class="field"><label for="ucap">Beschreibung</label><textarea id="ucap" maxlength="150" placeholder="Worum geht’s? Tipp: #hashtags"></textarea></div>
      <div class="err" id="uerr"></div>
      <button class="btn" id="ubtn" style="width:100%" disabled>Veröffentlichen</button>
    </form></div></div>`;
  const file = $('#ufile'), prev = $('#uprev'), btn = $('#ubtn');
  const pick = f => {
    $('#uerr').textContent = '';
    if (!f) return;
    if (!/^video\//.test(f.type)) { $('#uerr').textContent = 'Das ist keine Videodatei.'; return; }
    if (f.size > MAX_VIDEO_MB * 1024 * 1024){ $('#uerr').textContent = `Die Datei ist größer als ${MAX_VIDEO_MB} MB.`; return; }
    $('#dname').textContent = f.name;
    prev.src = URL.createObjectURL(f); prev.hidden = false; btn.disabled = false;
    pick.file = f;
  };
  file.addEventListener('change', () => pick(file.files[0]));
  const drop = $('#drop');
  drop.addEventListener('dragover', e => e.preventDefault());
  drop.addEventListener('drop', e => { e.preventDefault(); pick(e.dataTransfer.files[0]); });

  $('#uform').addEventListener('submit', async e => {
    e.preventDefault();
    const f = pick.file; if (!f) return;
    btn.disabled = true; btn.textContent = 'Wird hochgeladen …';
    const ext = (f.name.split('.').pop() || 'mp4').toLowerCase();
    const path = `${me.id}/${Date.now()}.${ext}`;
    const up = await sb.storage.from('klipp-videos').upload(path, f, { contentType: f.type, cacheControl: '3600' });
    if (up.error){ $('#uerr').textContent = 'Upload fehlgeschlagen: ' + up.error.message; btn.disabled = false; btn.textContent = 'Veröffentlichen'; return; }
    const url = sb.storage.from('klipp-videos').getPublicUrl(path).data.publicUrl;
    const ins = await sb.from('klipp_videos').insert({ user_id: me.id, video_url: url, storage_path: path, caption: $('#ucap').value.trim() });
    if (ins.error){
      await sb.storage.from('klipp-videos').remove([path]);
      $('#uerr').textContent = 'Speichern fehlgeschlagen: ' + ins.error.message;
      btn.disabled = false; btn.textContent = 'Veröffentlichen'; return;
    }
    toast('Veröffentlicht');
    feedTab = 'foryou';
    location.hash = '#/u/' + myProfile.username;
  });
}

function viewAuth(){
  if (me){ location.replace('#/'); return; }
  const reg = authMode === 'register';
  view.innerHTML = `<div class="page"><div class="narrow">
    <h1>${reg ? 'Konto erstellen' : 'Willkommen zurück'}</h1>
    <p class="muted" style="margin-top:8px">${reg ? 'Mach mit, lade Clips hoch und folge Creatorn.' : 'Melde dich an, um zu liken, zu kommentieren und hochzuladen.'}</p>
    <div class="seg"><button data-m="login" class="${reg ? '' : 'on'}">Anmelden</button><button data-m="register" class="${reg ? 'on' : ''}">Registrieren</button></div>
    <div style="margin-top:20px">${OAUTH.map(p => `<button type="button" class="oauth ${p}" data-oauth="${p}">${OAUTH_LABEL[p]}</button>`).join('')}</div>
    <div class="or"><span>oder mit E-Mail</span></div>
    <form id="aform" novalidate>
      ${reg ? `<div class="field"><label for="aun">Nutzername</label><input id="aun" autocomplete="username" maxlength="24" placeholder="z. B. max.klipp" required></div>` : ''}
      <div class="field"><label for="aem">E-Mail</label><input id="aem" type="email" autocomplete="email" required></div>
      <div class="field"><label for="apw">Passwort</label><input id="apw" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}" minlength="6" required></div>
      <div class="err" id="aerr" role="alert"></div>
      <button class="btn" id="abtn" style="width:100%">${reg ? 'Konto erstellen' : 'Anmelden'}</button>
    </form></div></div>`;
  $$('.seg button', view).forEach(b => b.addEventListener('click', () => { authMode = b.dataset.m; viewAuth(); }));
  $$('[data-oauth]', view).forEach(b => b.addEventListener('click', async () => {
    const { error } = await sb.auth.signInWithOAuth({ provider: b.dataset.oauth, options: { redirectTo: location.href.split('#')[0].split('?')[0] } });
    if (error) $('#aerr').textContent = authError(error.message);
  }));
  $('#aform').addEventListener('submit', async e => {
    e.preventDefault();
    const err = $('#aerr'), btn = $('#abtn');
    err.className = 'err'; err.textContent = '';
    const email = $('#aem').value.trim(), password = $('#apw').value;
    if (!email || password.length < 6){ err.textContent = 'Bitte gültige E-Mail und ein Passwort mit mindestens 6 Zeichen eingeben.'; return; }
    btn.disabled = true;
    if (reg){
      const username = $('#aun').value.trim().toLowerCase();
      if (!/^[a-z0-9_.]{3,24}$/.test(username)){ err.textContent = 'Nutzername: 3–24 Zeichen, nur Buchstaben, Zahlen, _ und .'; btn.disabled = false; return; }
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username }, emailRedirectTo: location.href.split('#')[0].split('?')[0] } });
      if (error){ err.textContent = authError(error.message); btn.disabled = false; return; }
      if (!data.session){ err.className = 'err ok'; err.textContent = 'Fast geschafft: Wir haben dir eine Bestätigungs-Mail geschickt. Klicke den Link, dann kannst du dich anmelden.'; btn.disabled = false; }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error){ err.textContent = authError(error.message); btn.disabled = false; }
    }
  });
}
function authError(m){
  if (/Invalid login/i.test(m)) return 'E-Mail oder Passwort stimmt nicht.';
  if (/already registered/i.test(m)) return 'Diese E-Mail ist schon registriert.';
  if (/Database error/i.test(m)) return 'Dieser Nutzername ist schon vergeben.';
  if (/not confirmed/i.test(m)) return 'Bitte bestätige zuerst deine E-Mail-Adresse.';
  if (/rate limit/i.test(m)) return 'Zu viele Versuche. Probier es in ein paar Minuten nochmal.';
  return m;
}

    <button class="thumb" data-i="${i}" aria-label="Video ansehen">
      <video src="${esc(v.video_url)}#t=0.3" preload="metadata" muted playsinline></video>
      <span><svg class="i" viewBox="0 0 24 24">${IC.heart}</svg>${fmt(v.likeCount)}</span>
    </button>`).join('')}</div>`;
  $$('.thumb', el).forEach(t => t.addEventListener('click', () => openViewer(list, +t.dataset.i)));
}

/* ---------- Suche ---------- */
function viewSearch(){
  view.innerHTML = `<div class="page"><div class="pwide narrow2">
    <h1>Suche</h1>
    <input id="sq" class="sinput" placeholder="Nutzer, Videos oder #hashtags" autocomplete="off">
    <div class="chips smode" style="margin:16px 0"><button data-sm="users">Nutzer</button><button data-sm="videos">Videos</button></div>
    <div id="sres"></div></div></div>`;
  const input = $('#sq');
  const paintMode = () => $$('.smode button').forEach(b => b.classList.toggle('on', b.dataset.sm === sMode));
  const run = () => runSearch(input.value);
  paintMode(); run();
  input.addEventListener('input', () => { clearTimeout(sTimer); sTimer = setTimeout(run, 300); });
  $$('.smode button').forEach(b => b.addEventListener('click', () => { sMode = b.dataset.sm; paintMode(); run(); }));
}
async function runSearch(raw){
  const box = $('#sres'); if (!box) return;
  const q = likeSafe(raw);
  const stale = () => !$('#sq') || $('#sq').value !== raw;
  if (!q){
    const { data } = await sb.from('klipp_videos').select('caption').order('created_at', { ascending: false }).limit(150);
    if (stale()) return;
    const counts = new Map();
    (data || []).forEach(r => (String(r.caption).match(/#[\p{L}\p{N}_]{1,40}/gu) || []).forEach(t => { t = t.toLowerCase(); counts.set(t, (counts.get(t) || 0) + 1); }));
    const top = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 14);
    box.innerHTML = top.length
      ? `<p class="muted" style="margin-bottom:10px">Beliebte Hashtags</p><div class="tagchips">${top.map(([t, n]) => `<a href="#/tag/${encodeURIComponent(t.slice(1))}">${esc(t)}<small>${n}</small></a>`).join('')}</div>`
      : '<div class="msg">Such nach Nutzern, Videos oder #hashtags.</div>';
    return;
  }
  box.innerHTML = '<div class="spin"></div>';
  if (q.startsWith('#') && q.length > 1){ location.hash = '#/tag/' + encodeURIComponent(q.slice(1).toLowerCase()); return; }
  if (sMode === 'users'){
    const term = q.replace(/^@/, '');
    const { data, error } = await sb.from('klipp_profiles').select('id,username,display_name,avatar_url').or(`username.ilike.%${term}%,display_name.ilike.%${term}%`).limit(30);
    if (stale()) return;
    if (error) { box.innerHTML = `<div class="msg">${esc(error.message)}</div>`; return; }
    box.innerHTML = data.length ? data.map(p => `
      <a class="row" href="#/u/${esc(p.username)}">${avatar(p, 48)}
        <div class="t"><b>${esc(p.display_name || p.username)}</b><p>@${esc(p.username)}</p></div></a>`).join('')
      : '<div class="msg">Keine Nutzer gefunden.</div>';
  } else {
    const { data, error } = await sb.from('klipp_videos').select(SEL).ilike('caption', `%${q}%`).order('created_at', { ascending: false }).limit(40);
    if (stale()) return;
    if (error) { box.innerHTML = `<div class="msg">${esc(error.message)}</div>`; return; }
    thumbGrid(box, await enrich(data));
  }
}

/* ---------- Hashtag-Seite ---------- */
async function viewTag(tag){
  tag = tag.toLowerCase();
  view.innerHTML = `<div class="page"><div class="pwide">
    <h1>#${esc(tag)}</h1><p class="muted" id="tcount" style="margin:6px 0 22px"></p>
    <div id="tgrid"><div class="spin"></div></div></div></div>`;
  const { data, error } = await sb.from('klipp_videos').select(SEL).ilike('caption', `%#${likeSafe(tag)}%`).order('created_at', { ascending: false }).limit(80);
  if (!$('#tgrid')) return;
  if (error){ $('#tgrid').innerHTML = `<div class="msg">${esc(error.message)}</div>`; return; }
  const re = new RegExp('#' + escRe(tag) + '(?![\\p{L}\\p{N}_])', 'iu');
  const vids = await enrich(data.filter(r => re.test(r.caption)));
  $('#tcount').textContent = vids.length === 1 ? '1 Video' : `${vids.length} Videos`;
  thumbGrid($('#tgrid'), vids);
}

/* ---------- Mitteilungen ---------- */
async function viewInbox(){
  if (!me) return authGate('Melde dich an, um deine Mitteilungen zu sehen.');
  view.innerHTML = '<div class="page"><div class="pwide narrow2"><h1>Mitteilungen</h1><div id="nlist" style="margin-top:18px"><div class="spin"></div></div></div></div>';
  const { data, error } = await sb.from('klipp_notifications')
    .select('id,type,video_id,body,read,created_at,actor:klipp_profiles!klipp_notifications_actor_id_fkey(username,avatar_url)')
    .eq('user_id', me.id).order('created_at', { ascending: false }).limit(60);
  const box = $('#nlist'); if (!box) return;
  if (error){ box.innerHTML = `<div class="msg">${esc(error.message)}<br>Hast du features.sql ausgeführt?</div>`; return; }
  if (!data.length){ box.innerHTML = '<div class="msg">Noch keine Mitteilungen. Sobald jemand dein Video liked, kommentiert oder dir folgt, siehst du es hier.</div>'; return; }
  const text = { like: 'hat dein Video geliked', comment: 'hat dein Video kommentiert', follow: 'folgt dir jetzt' };
  box.innerHTML = data.map(n => {
    const a = n.actor || {};
    const inner = `${avatar(a, 46)}<div class="t"><b>@${esc(a.username)}</b> ${text[n.type]}${n.body ? `<p>„${esc(n.body)}“</p>` : ''}</div><span class="when">${ago(n.created_at)}</span>${n.read ? '' : '<span class="dot"></span>'}`;
    return n.type === 'follow'
      ? `<a class="row ${n.read ? '' : 'unread'}" href="#/u/${esc(a.username)}">${inner}</a>`
      : `<button class="row ${n.read ? '' : 'unread'}" data-act="open-video" data-vid="${n.video_id}">${inner}</button>`;
  }).join('');
  if (data.some(n => !n.read)){
    await sb.from('klipp_notifications').update({ read: true }).eq('user_id', me.id).eq('read', false);
    unread.n = 0; paintBadges();
  }
}

/* ---------- Nachrichten: Liste ---------- */
async function viewMessages(){
  if (!me) return authGate('Melde dich an, um Nachrichten zu schreiben.');
  view.innerHTML = `<div class="page"><div class="pwide narrow2"><h1>Nachrichten</h1>
    <form id="nform" class="sbar"><input id="nname" placeholder="Neue Nachricht an Nutzername …" autocomplete="off"><button class="btn small">Los</button></form>
    <div id="mlist"><div class="spin"></div></div></div></div>`;
  $('#nform').addEventListener('submit', e => {
    e.preventDefault();
    const n = $('#nname').value.trim().replace(/^@/, '').toLowerCase();
    if (n) location.hash = '#/messages/' + encodeURIComponent(n);
  });
  const { data, error } = await sb.from('klipp_messages').select('id,sender_id,recipient_id,body,read_at,created_at')
    .or(`sender_id.eq.${me.id},recipient_id.eq.${me.id}`).order('created_at', { ascending: false }).limit(300);
  const box = $('#mlist'); if (!box) return;
  if (error){ box.innerHTML = `<div class="msg">${esc(error.message)}<br>Hast du features.sql ausgeführt?</div>`; return; }
  const conv = new Map();
  data.forEach(m => {
    const other = m.sender_id === me.id ? m.recipient_id : m.sender_id;
    if (!conv.has(other)) conv.set(other, { last: m, unread: 0 });
    if (m.recipient_id === me.id && !m.read_at) conv.get(other).unread++;
  });
  if (!conv.size){ box.innerHTML = '<div class="msg">Noch keine Nachrichten. Gib oben einen Nutzernamen ein oder öffne ein Profil und tippe auf „Nachricht“.</div>'; return; }
  const { data: profs } = await sb.from('klipp_profiles').select('id,username,display_name,avatar_url').in('id', [...conv.keys()]);
  const pm = new Map((profs || []).map(p => [p.id, p]));
  box.innerHTML = [...conv.entries()].map(([id, c]) => {
    const p = pm.get(id) || {};
    return `<a class="row ${c.unread ? 'unread' : ''}" href="#/messages/${esc(p.username)}">${avatar(p, 48)}
      <div class="t"><b>${esc(p.display_name || p.username)}</b><p>${c.last.sender_id === me.id ? 'Du: ' : ''}${esc(c.last.body)}</p></div>
      <span class="when">${ago(c.last.created_at)}</span>${c.unread ? `<i class="badge" style="margin-left:0">${c.unread}</i>` : ''}</a>`;
  }).join('');
}

/* ---------- Nachrichten: Chat ---------- */
async function viewThread(username){
  if (!me) return authGate('Melde dich an, um Nachrichten zu schreiben.');
  const { data: p } = await sb.from('klipp_profiles').select('id,username,display_name,avatar_url').eq('username', username.toLowerCase()).maybeSingle();
  if (!p){ view.innerHTML = `<div class="empty"><div><h2>Nutzer nicht gefunden</h2><p class="muted">@${esc(username)} gibt es nicht.</p><a class="btn" href="#/messages">Zurück</a></div></div>`; return; }
  if (p.id === me.id){ location.replace('#/messages'); return; }
  view.innerHTML = `<div class="chat">
    <div class="chath"><a class="ic-btn" href="#/messages" aria-label="Zurück">${svg('back')}</a>
      <a href="#/u/${esc(p.username)}" style="display:flex;align-items:center;gap:10px">${avatar(p, 38)}<b>${esc(p.display_name || p.username)}</b></a></div>
    <div class="bubbles" id="bubbles"><div class="spin"></div></div>
    <form id="mform"><input id="minput" maxlength="1000" placeholder="Nachricht schreiben …" autocomplete="off"><button class="btn small">Senden</button></form>
  </div>`;
  let msgs = [], lastKey = '', first = true;
  const draw = () => {
    const el = $('#bubbles'); if (!el) return;
    const atBottom = first || el.scrollHeight - el.scrollTop - el.clientHeight < 90;
    el.innerHTML = msgs.length
      ? msgs.map(m => `<div class="bub ${m.sender_id === me.id ? 'me' : ''}">${esc(m.body)}<small>${hhmm(m.created_at)}</small></div>`).join('')
      : `<div class="msg">Schreib die erste Nachricht an @${esc(p.username)}.</div>`;
    if (atBottom) el.scrollTop = el.scrollHeight;
    first = false;
  };
  const load = async () => {
    if (!$('#bubbles')){ clearInterval(msgTimer); return; }
    const { data, error } = await sb.from('klipp_messages').select('id,sender_id,recipient_id,body,read_at,created_at')
      .or(`and(sender_id.eq.${me.id},recipient_id.eq.${p.id}),and(sender_id.eq.${p.id},recipient_id.eq.${me.id})`)
      .order('created_at', { ascending: true }).limit(200);
    if (error){ if (first) $('#bubbles').innerHTML = `<div class="msg">${esc(error.message)}<br>Hast du features.sql ausgeführt?</div>`; return; }
    const key = (data.length ? data[data.length - 1].id : '') + ':' + data.length;
    if (key !== lastKey || first){ lastKey = key; msgs = data; draw(); }
    if (data.some(m => m.sender_id === p.id && !m.read_at)){ await sb.rpc('klipp_mark_read', { other_id: p.id }); refreshBadges(); }
  };
  await load();
  clearInterval(msgTimer); msgTimer = setInterval(load, 5000);
  $('#mform').addEventListener('submit', async e => {
    e.preventDefault();
    const input = $('#minput'), body = input.value.trim();
    if (!body) return;
    input.value = '';
    const { data, error } = await sb.from('klipp_messages').insert({ sender_id: me.id, recipient_id: p.id, body }).select('id,sender_id,recipient_id,body,read_at,created_at').single();
    if (error){ input.value = body; return toast('Nachricht konnte nicht gesendet werden.'); }
    msgs.push(data); lastKey = data.id + ':' + msgs.length; first = true; draw();
  });
}

/* =========================================================
   Start
   ========================================================= */
(async function init(){
  view.innerHTML = '<div class="spin"></div>';
  const { data } = await sb.auth.getSession();
  me = data.session?.user || null;
  let lastUid = me?.id || null;
  await loadMe();
  refreshBadges(); setInterval(refreshBadges, 30000);
  sb.auth.onAuthStateChange((ev, session) => {
    const uid = session?.user?.id || null;
    if (uid === lastUid) return;
    lastUid = uid; me = session?.user || null;
    setTimeout(async () => {
      await loadMe(); refreshBadges();
      if (location.hash === '#/auth') location.hash = '#/'; else route();
    }, 0);
  });
  route();
})();
</script>
